# ~/.config/hypr/colors.conf
#
# The single palette for the "Monochrome Vivid" theme.
# To recolour the whole lock screen, change the values here only: hyprlock.conf
# does not store them, it refers to them through $variables.
#
# The idea behind the palette: NOT ONE hue anywhere. States — an idle field,
# caps lock, a wrong password — are told apart by the BRIGHTNESS and opacity of
# white rather than by colour. Hence "vivid": not vivid colours, but a vivid,
# high-contrast black and white.

$font = JetBrainsMono Nerd Font

# ---- Base tones ----
$c_black        = rgba(10, 10, 10, 1.0)
$c_panel        = rgba(18, 18, 20, 0.55)
$c_panel_border = rgba(255, 255, 255, 0.12)

# ---- Text ----
$c_white       = rgba(240, 240, 242, 1.0)
$c_grey_light  = rgba(205, 205, 208, 0.88)
$c_grey_mid    = rgba(165, 165, 169, 0.80)

# ---- The password field: three levels of brightness instead of three colours ----
$c_idle_ring  = rgba(255, 255, 255, 0.20)
$c_caps_ring  = rgba(255, 255, 255, 0.55)
$c_num_ring   = rgba(255, 255, 255, 0.32)
$c_both_ring  = rgba(255, 255, 255, 0.85)
$c_check_ring = rgba(255, 255, 255, 0.75)
$c_fail_ring  = rgba(255, 255, 255, 1.0)
