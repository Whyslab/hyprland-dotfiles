
$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = __HOME__/.local/share/rofi-launcher/launch.sh
$browser = firefox

exec-once = hyprsunset
# Dismisses the Hyprland startup notice about the .conf format
exec-once = ~/.config/hypr/scripts/dismiss-startup-notify.sh
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start screen-sleep-daemon.service
# Password prompt for polkit (hyprpolkitagent, the Hyprland one). Its service is
# tied to graphical-session.target, which Hyprland started from SDDM does not
# reach — without this line the agent never starts and anything that needs admin
# rights just hangs. One chain, after handing WAYLAND_DISPLAY to systemd: the
# service skips itself without it.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && systemctl --user start hyprpolkitagent.service

# The wallpaper daemon
exec-once = awww-daemon
# Restore the wallpaper after login (the script waits for the daemon itself)
exec-once = ~/.config/hypr/scripts/wallpaper.sh restore
exec-once = hyprpanel
# exec-once = hyprlock

# Clipboard watchers: they run in the background and remember text and images
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


exec-once = [workspace 1 silent] firefox
# exec-once = [workspace 2 silent] spotify


bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod SHIFT, R, exec, rofi -show drun   # the plain flat list, as a fallback

bind = SUPER, escape, exec, wlogout --layout ~/.config/wlogout/layout --css ~/.config/wlogout/style.css -b 3 -L 200 -R 200 -T 120 -B 120

bind = SUPER SHIFT, N, exec, python3 ~/.local/share/screen-sleep/gui.py

# Ctrl+J: clipboard history through rofi
bind = CTRL, J, exec, cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy

# Ctrl+D: colour picker (the HEX value goes straight to the clipboard)
bind = CTRL, D, exec, hyprpicker -a

# Screenshot a region: the screen is captured first and then frozen for the
# selection, which is why tooltips and panel menus do not vanish (see the script)
bind = SUPER SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh area
# Print: the whole screen at once, no selection
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh screen

# Browser
bind = SUPER, F, exec, $browser

# Wallpaper: Super+W cycles to the next one, Super+Shift+W picks one in rofi
# (the picker also sets the lock screen and login backgrounds — three separate targets)
bind = SUPER, W, exec, ~/.config/hypr/scripts/wallpaper.sh next
bind = SUPER SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper.sh pick



# Volume, through wpctl
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle       # Fn+F1 (mute)
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # Fn+F2 (quieter)
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # Fn+F3 (louder)

# Brightness
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%- # Fn+F5 (dimmer)
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+   # Fn+F6 (brighter)


# WORKSPACES

# switch workspaces with a three-finger swipe
gesture = 3, horizontal, workspace 

# Switch workspace (Super + number)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move the active window to a workspace (Super + Shift + number)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Next / previous workspace in order (Super + PgUp/PgDn)
bind = SUPER, Page_Down, workspace, +1
bind = SUPER, Page_Up, workspace, -1

# WINDOWS

# Super + left mouse button: move a window
bindm = SUPER, mouse:272, movewindow

# Super + right mouse button: resize a window
bindm = SUPER, mouse:273, resizewindow

# Cycle through the windows on the current workspace
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,

# Move the active window around
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d



general {
    # gaps_in: the gap BETWEEN windows
    # gaps_out: the gap from the SCREEN EDGE
    gaps_in = 4
    gaps_out = 6
    
    border_size = 2
    col.active_border = rgba(333333ff) rgba(333333ff) 45deg
    col.inactive_border = rgba(111111ff)

    layout = dwindle
}

decoration {
    # Corner radius
    rounding = 12
    
    # Opacity
    active_opacity = 1.0
    inactive_opacity = 1.0

    # Blur behind transparent windows
    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
        ignore_opacity = true
    }
}

# The power menu (SUPER+ESC) — frosted glass, matching the lock screen.
# The namespace is wlogout (see strings /usr/bin/wlogout), not logout.
layerrule[namespace:wlogout] = blur true
layerrule[namespace:wlogout] = ignorezero true

# Keyboard layouts and natural scrolling
input {
  kb_layout = us,ru
  kb_options = grp:win_space_toggle
  touchpad {
      natural_scroll = true
   }
}
# Fixes scaling for every XWayland application, Steam included
xwayland {
    force_zero_scaling = true
}

env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

# Without this block something important will break or start misbehaving
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# --- added by the Monochrome Vivid theme installer ---
exec-once = hypridle

# rofi-command-center-keybind
bind = SUPER SHIFT, C, exec, __HOME__/.local/share/rofi-command-center/launcher.sh


# Qwen-Max Wayland env
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland
env = SDL_VIDEODRIVER,wayland
env = ELECTRON_OZONE_PLATFORM,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# backup-manager hotkey
bind = SUPER SHIFT, B, exec, /opt/backup-manager/ui/rofi_menu.sh


# The sysmon special workspace — btop on top of whatever is focused.
# btop starts with the session and lives hidden in the special workspace, so
# that by the first time it is summoned the graphs already hold some history
# instead of starting from nothing. The `silent` keyword lives inside the
# script; without it the window would pop up during login.
exec-once = ~/.config/hypr/scripts/sysmon.sh start
# code:49 is the physical key below Esc; binding by code is layout-independent.
bind = SUPER, code:49, exec, ~/.config/hypr/scripts/sysmon.sh

# There used to be a SUPER SHIFT code:49 binding that moved a window into this
# special workspace. It was removed: a window sent there started living with
# btop — hiding and popping up on top of everything along with it — and there
# was no way to get it back. The special workspace is for btop alone.

# A separate btop-scratch class, so these rules do not catch ordinary kitty
# windows opened with SUPER+Q.
# Hyprland 0.56 syntax: one line is a comma-separated list of "field value"
# pairs, with matchers prefixed by match:. The [] brackets name the rule; they
# are not a matcher. The size must be an expression — "size 90% 90%" is
# silently ignored here. 0.9 rather than 0.78, because at 0.78 only 23 rows
# fit in the window and btop needs at least 24.
windowrule = match:class ^(btop-scratch)$, float true, size monitor_w*0.9 monitor_h*0.9, center true, workspace special:sysmon
