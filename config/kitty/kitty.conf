# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Padding and window appearance
window_padding_width 20
hide_window_decorations yes
confirm_os_window_close 0
linux_display_server wayland

# Colour scheme: Monochrome Vivid
background #0a0a0a
foreground #ffffff

# Cursor
cursor #ffffff
cursor_text_color #000000
cursor_shape block

# Selection
selection_background #ffffff
selection_foreground #000000

# ANSI colours, adapted to the monochrome palette
# Black
color0 #161616
color8 #444444

# Red, kept dim, for errors
color1 #cc0000
color9 #ff4444

# Green, for success messages
color2  #88cc88
color10 #aaffaa

# Yellow / blue / magenta / cyan / white
# Muted to greys and whites to keep the palette monochrome while leaving syntax
# highlighting readable.
color3  #aaaaaa
color11 #cccccc
color4  #666666
color12 #999999
color5  #888888
color13 #bbbbbb
color6  #777777
color14 #aaaaaa
color7  #dddddd
color15 #ffffff



