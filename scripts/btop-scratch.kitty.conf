# A kitty config used only by the pop-up btop (special:sysmon).
# Loaded through `kitty --config`, so the main config is pulled in whole first —
# font, theme and everything else stay as you have them.
include __HOME__/.config/kitty/kitty.conf

# The main config has 20 px of padding on each side. That is fine for a
# full-size window, but it cost the pop-up btop rows: it needs at least 24 and
# only 23 fit, so btop printed "Terminal size too small".
window_padding_width 8

# Esc hides the window rather than closing it. btop is started with the session
# and has to keep running: that is the only way its graphs are full of history
# by the next time it is summoned. This used to be close_window, which killed
# btop along with the window.
# btop's own `q` is a separate matter: under a non-Latin keyboard layout that
# key produces a different character and btop does not recognise it.
# Closing the window for good (and killing btop) is still kitty's Ctrl+Shift+W.
map escape launch --type=background hyprctl dispatch togglespecialworkspace sysmon
